name: Release

# Push tag `v*` → build 2 image lên GHCR (tag version + latest).
# Watchtower trên server poll tag `latest` và tự update — không cần deploy job.
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag khớp package.json version
        run: |
          pkg_version=$(node -p "require('./frontend/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} khác version trong frontend/package.json (${pkg_version})"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-api
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-api
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_CONTENT_VERSION=${{ github.ref_name }}

