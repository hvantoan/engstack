# engstack backend local runtime. Postgres is exposed on host port 5433 to avoid
# clashing with other local PostgreSQL instances.
services:
  postgres:
    image: postgres:16-alpine
    container_name: engstack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: engstack
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: engstack-api
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/engstack?sslmode=disable"
      JWT_SECRET: "dev-insecure-secret-key-change-in-prod"
      GOOGLE_CLIENT_ID: "mock-google-client-id"
      AUTH_DEV_MODE: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "8080:8080"
    volumes:
      - ./src/data:/app/src/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
